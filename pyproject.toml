[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-that-run"
version = "0.1.2"
description = "Validate explicitly marked Python and Bash code blocks in Markdown files."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "kuoch" },
]
keywords = ["markdown", "documentation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gfr211306-crypto/docs-that-run"
Issues = "https://github.com/gfr211306-crypto/docs-that-run/issues"

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.scripts]
dtr = "docs_that_run.cli:main"

[tool.setuptools.packages.find]
include = ["docs_that_run*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
